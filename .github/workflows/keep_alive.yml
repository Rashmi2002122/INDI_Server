name: Render Backend Keep-Alive

on:
  schedule:
    # Run every 10 minutes 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend Health Endpoint
        run: |
          echo "Pinging Render backend..."
          curl -s -o /dev/null -w "%{http_code}" https://indi-server.onrender.com/api/health
